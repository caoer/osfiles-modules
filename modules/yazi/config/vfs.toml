# SFTP VFS services — nightly [sftp] spelling (#4120), read by the Darwin
# binary (upstream nightly via the yazi-github flake input). The 26.5.6 fleet
# binary ignores this section entirely — the old [services] spelling CANNOT sit
# alongside it: nightly deserializes every top-level section as a VFS scheme,
# so a [services] block hard-fails its config parse ("missing field kind").
# Servers regain VFS when the fleet baseline moves past 26.5.6.
#
# Browse:  g <Space>  then  sftp://<name>//<remote-path>  (double slash).
# Auth rides $SSH_AUTH_SOCK by default; add absolute `key_file` per host if
# the agent doesn't hold its key. Entries mirror lib/ssh/hosts/ (shellkit
# inventory) — osfiles-managed hosts with stable public endpoints, plus
# lazybox for CQ-LAN sessions. Names must be kebab-case, 1-20 chars.

[sftp]
dmit-us-lax = { host = "179.253.232.52", user = "caoer115", port = 22 }
