# herdr config — ONE file for every host (mac + Linux agent boxes).
#
# Delivery: the mac gets an out-of-store symlink to this file (home/darwin/
# files.nix), so edits here are live and herdr's own settings writes (prefix+s)
# land back in the repo. Linux hosts get a read-only store copy through
# home/linux/herdr.nix — change settings HERE and rebuild, not on the box.
# Plugins are not in this file: pins live in bin/herdr-plugins-sync, plugin
# settings in config/herdr/plugins/.
#
# Keep it host-independent — no /Users/... or /home/... paths. Custom commands
# get the full login PATH (verified on 0.8.0, shell + popup), so call a script
# by bare name and ship it to every host instead of hardcoding a home.
onboarding = false

# ---------------------------------------------------------------------------
# [file_click] — click-to-open file paths in terminal output.
# Requires a shell integration script to wrap paths in OSC 8 hyperlinks.
# See: ~/.local/bin/herdr-file-hyperlink
# ---------------------------------------------------------------------------
# [file_click]
# enabled = true
#
# [file_click.modifiers]
# popup = "ctrl"       # ctrl+click → open in popup pane (nvim), closes on exit
# tab = "cmd"          # cmd+click → open in new tab
# split = "alt"        # alt+click → open in split pane
# selector = "shift"   # shift+click → opener selector popup
#
# [file_click.openers]
# default = "nvim {file}"
# md = "nvim {file}"
# rs = "nvim {file}"
# toml = "nvim {file}"
# json = "nvim {file}"
# yaml = "nvim {file}"
# yml = "nvim {file}"
# py = "nvim {file}"
# go = "nvim {file}"
# ts = "nvim {file}"
# js = "nvim {file}"
# html = "nvim {file}"
# css = "nvim {file}"
# sh = "nvim {file}"
# nix = "nvim {file}"
# txt = "nvim {file}"
# log = "nvim {file}"
# csv = "nvim {file}"
# lua = "nvim {file}"
# conf = "nvim {file}"
# cfg = "nvim {file}"
# ini = "nvim {file}"
# env = "nvim {file}"
#
# [file_click.selector_openers]
# nvim = "nvim {file}"
# yazi = "yazi {file}"
# editor = "$EDITOR {file}"

[theme]
# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine,
#                  vesper
# Follow host terminal light/dark appearance and switch Herdr UI themes.
# Existing manual behavior is unchanged unless this is true.

# Override individual color tokens on top of the base theme.
# Accepts: hex (#rrggbb), named colors, rgb(r,g,b), or panel_bg = "reset"
# surface0/surface1 are the selection/hover surfaces (catppuccin naming);
# tokyo-night's defaults sit too close to panel_bg — the agent-view selected
# row was invisible. #33467c is tokyo-night's selection blue, #3b4261 its
# fg_gutter: both clearly elevated on the #1a1b26 panel.
# Auto light/dark. With auto_switch = true herdr reads dark_name/light_name
# and IGNORES `name` (src/app/mod.rs resolve_effective_theme: `name` is the
# manual-mode value only). Appearance comes from an OSC query to the host
# terminal; when it cannot be determined herdr falls back to Dark, so
# dark_name is the safe default and light only wins on a positive answer.
# `name` is kept as the manual-mode value in case auto_switch is turned off.
name = "catppuccin-latte"
auto_switch = true
dark_name = "tokyo-night"
light_name = "catppuccin-latte"
[theme.custom]
# surface_dim paints the agent-view selected row. Base themes map it too
# close to panel_bg, which made the selection invisible. #4d4467 is the
# #282a36 panel blended 25% toward dracula purple (#bd93f9): a clearly
# purple selection tint that keeps the pinned agent-row fg colors readable.
# Stronger: #5c4f7a (35% blend). Neutral fallback: #44475a.
# surface_dim = "#392839"
# surface_dim = "#b593e9"
# surface_dim = "#d7cee9"
[terminal]
# Executable used for new interactive panes.
# Empty means $SHELL, then /bin/sh.
# default_shell = ""

# Startup mode for new interactive pane shells: "auto", "login", or "non_login".
# "auto" uses login shells on macOS and keeps the current behavior elsewhere.
shell_mode = "auto"

# CWD policy for new panes, tabs, and workspaces when no explicit --cwd is provided.
# Use "follow" to inherit the source pane/workspace, "home" for $HOME,
# "current" for Herdr's process directory, or a fixed path such as "~/Projects".
new_cwd = "follow"

[update]
# Update channel used by background version checks and `herdr update`.
# Defaults to "stable" on Linux/macOS and "preview" on Windows.
# Set explicitly to choose stable releases or opt-in preview builds.
# channel = "stable"

# Check herdr.dev for new Herdr versions in the background.
# version_check = true

# Check herdr.dev for remote agent-detection manifest updates in the background.
# manifest_check = true

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
# Examples: "ctrl+b", "f12", "esc", "-"
# Action bindings use explicit syntax: "prefix+n" requires the prefix;
# "ctrl+alt+n" is a direct terminal-mode shortcut.
# Accepted key syntax: plain keys, ctrl/shift/alt/cmd/super modifiers, and special keys like enter/tab/esc/left/right/up/down.
# Named punctuation such as minus, comma, ampersand, plus, and backtick is also accepted.
# Most reliable direct bindings are ctrl+letter, function keys, and explicit modified chords.
# alt+..., cmd/super, and punctuation-with-modifiers may depend on your terminal/tmux setup.
# prefix = "ctrl+b"

# Prefix-mode actions
# help = "prefix+?"
# settings = "prefix+s"
# detach = "prefix+q"
# reload_config = "prefix+shift+r"
# open_notification_target = "prefix+o"
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+shift+g"
# open_worktree = ""    # optional, unset by default
# remove_worktree = ""  # optional, unset by default; opens confirmation
# rename_workspace = "prefix+shift+w"
# close_workspace = "prefix+shift+d"
# Halo75 right column (QMK free F-keys → WezTerm → these chords):
#   PGUP/F21 → alt+shift+k | PGDN/F22 → alt+shift+j
#   HOME/F23 → alt+up      | END/F24  → alt+down
#   DEL/F18  → prefix+z (zoom, via WezTerm SendString)
#   Insert   → alt+1 (focus agent rank 1; full alt+1..9 below)
previous_workspace = "alt+shift+k"
next_workspace = "alt+shift+j"
# alt+j/k are taken: wezterm rewrites them to prefix+j/k (pane focus).
previous_agent = "alt+up"
next_agent = "alt+down"
focus_agent = "alt+1..9"
remote_image_paste = "ctrl+v" # only active in herdr --remote; empty disables raw-key image paste
# new_tab = "prefix+c"
rename_tab = "prefix+comma"
# previous_tab = "prefix+p"
# next_tab = "prefix+n"
switch_tab = "prefix+1..9"            # was prefix+alt+1..9; freed alt+1..9 for agents
switch_workspace = "prefix+shift+1..9"
# switch_workspace = ""   # optional indexed binding, e.g. "prefix+shift+1..9"
# close_tab = "prefix+shift+x"
# rename_pane = "prefix+shift+p"
# edit_scrollback = "prefix+e"
# focus_pane_left = "prefix+h"
# oocus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
# prefix+tab takes over from the default cycle_pane_next (user binding wins).
last_pane = "prefix+tab" # global back-and-forth with the previously focused pane
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
# close_pane = "prefix+x"
# zoom = "prefix+z"       # legacy alias: fullscreen
# resize_mode = "prefix+r"
# toggle_sidebar = "prefix+b"

# Navigate-mode movement. These local shortcuts win while navigate mode is open.
# They are independent from focus_pane_*. Do not include prefix+, esc, enter, tab, or 1..9 here.
# navigate_workspace_up = "up"
# navigate_workspace_down = "down"
# navigate_pane_left = "h"      # left arrow always focuses the pane to the left
# navigate_pane_down = "j"
# navigate_pane_up = "k"
# navigate_pane_right = "l"     # right arrow always focuses the pane to the right

# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# type = "popup" opens a session-modal terminal without changing the tab layout.
# Popup width and height accept terminal cells or percentages such as "80%".
# On Windows, command strings run through cmd.exe /d /c.
# [[keys.command]]
# key = "prefix+alt+g"
# type = "popup"
# command = "lazygit"
# width = "80%"
# height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "herdr-todo"
description = "todo note"
width = "80%"
height = "80%"

# Legacy indexed shortcut config is still parsed for compatibility.
# Prefer switch_tab, switch_workspace, and focus_agent for new configs.
# [keys.indexed]
# tabs = ""       # e.g. "ctrl" makes ctrl+1..9 switch tabs directly
# workspaces = "" # e.g. "ctrl+shift" makes ctrl+shift+1..9 switch workspaces directly
# agents = ""     # e.g. "alt" makes alt+1..9 focus agent rows directly

[worktrees]
directory = "~/.local/share/ucc/herdr/worktrees"

[ui]
# Sidebar width (auto-scaled based on workspace names, this sets the default)
# sidebar_width = 26

# Minimum sidebar width when expanded (columns)
# sidebar_min_width = 18
# Accent color for highlights, borders, and navigation UI.
# Accepts: hex (#89b4fa), named colors (cyan, blue, magenta), or rgb(r,g,b)
# accent = "#b2aed9"

# Maximum sidebar width when expanded (columns)
sidebar_max_width = 66

# Start with the sidebar collapsed. Changes take effect on the next launch.
# sidebar_start_collapsed = false

# Collapsed sidebar presentation: "compact" keeps the narrow status rail, "hidden" uses zero width.
# sidebar_collapsed_mode = "compact"

# Terminal width at or below which Herdr uses the mobile single-column layout.
# Increase this for foldables, tablets, or wide phone terminals.
# mobile_width_threshold = 64

# Capture mouse input for Herdr's mouse UI.
# Set false to let the terminal handle normal clicks, such as Cmd-clicking URLs.
# Pane apps like lazygit and btop can still receive mouse when they request it.
# mouse_capture = true

# Automatically copy text selected by mouse drag.
# Set false to keep drag selection visible without copying; double-click still copies a word.
copy_on_select = true

# Host cursor policy: "auto", "native", or "drawn".
# "auto" draws Herdr's own cursor on native Windows builds and WSL to avoid ConPTY cursor flicker, and uses the native terminal cursor elsewhere.
# "native" always uses the outer terminal cursor. "drawn" always draws Herdr's cursor as terminal cell content.
# host_cursor = "auto"

# Optional modifier that forwards right-click hold/drag gestures to pane apps instead of opening Herdr's pane menu.
# Empty/off disables this. Shift is intentionally unsupported because terminals commonly reserve Shift+mouse.
# right_click_passthrough_modifier = ""

# Force a full redraw when the outer terminal regains focus.
# Set false to reduce visible flashing when switching back to Herdr.
# Trade-off: rare host terminal surface corruption may persist until the next full redraw.
# redraw_on_focus_gained = true

# Pane scrollback lines to scroll per mouse wheel notch.
mouse_scroll_lines = 3

# Ask for confirmation before closing a workspace
# confirm_close = true

# Ask for a tab name before creating a new tab.
# Set false to create tabs immediately with generated names.
# prompt_new_tab_name = true

# Ask for a workspace name before interactive creation.
# prompt_new_workspace_name = false

# Draw borders around split panes.
# pane_borders = true

# Keep split panes visually separated instead of sharing divider borders.
# pane_gaps = true

# Show detected/reported agent labels in split pane borders when no manual pane name is set.
show_agent_labels_on_pane_borders = true

# Hide the tab row when a workspace has exactly one tab.
# New tabs can still be created with the configured keybinding.
# hide_tab_bar_when_single_tab = false

# Agent panel ordering: "spaces" (grouped by space) or "priority" (attention queue).
# "workspaces" is accepted as an alias for "spaces".
agent_panel_sort = "priority"

# Expanded agent rows. Built-ins are state_icon, state_text, workspace, tab, pane, agent,
# terminal_title, and terminal_title_stripped.
# Custom values reported through pane metadata use a $name token.
# A token occurrence may be styled with { token = "workspace", fg = "#89b4fa", bold = true, dim = false }.
# Omitted style fields preserve the contextual default.
[ui.sidebar.agents]
# Blank rows between agent entries. Set to 1 to restore the previous spacing.
row_gap = 0
rows = [["state_icon", "workspace", "tab"], ["agent"]]

# Every ucc pane is labelled "claude", so the default rows cannot tell ~40
# profiles apart. $profile and $session are pane metadata tokens pushed at
# SessionStart by `ccc-statusd hook herdr-identity`; $session is the ccc
# short id, so `ccc-statusd session send <id>` works straight off the sidebar.
# Optional canonical agent IDs replace the default rows for matching agents.
# claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]
[ui.sidebar.agents.rows_by_agent]
# Row vocabulary (writer: ccc-herdr painter, ccc-herdr.star render(v)):
# $session = ccc session dir name (ad-hoc when unjoined)
# $role_worker / $role_advisor / $role_leader = per-role tokens, exactly one
#   nonempty (herdr fg is single-valued, so per-role color = per-role token);
#   $role = fallback for roles outside the known three (omitted when none)
# $name = /rename title ONLY (omitted until renamed) · $profile = ucc profile (always present)
# $id = 8-char session id (rightmost: survives overflow)
# $idle = time since the session's last hook event ("5m"/"1h5m"/"2d3h"; omitted while active <1m)
# COLOUR CONTRACT for every fg below — read before changing one.
#
# What the text sits on: every built-in theme sets sidebar_bg = Color::Reset
# (herdr src/app/state.rs), so the agent panel's background is the TERMINAL's,
# not herdr's panel_bg — herdr's own dark_name/light_name never touch it. On
# any host that means whatever scheme the attached terminal is running; the
# mac's pair (config/wezterm/common.lua theme_families, family tokyo-night =
# Tokyo Night #1a1b26 / Tokyo Night Day #e1e2e7) is the design reference.
#
# One hex serves both: herdr's SidebarTokenColor (src/config/sidebar.rs) takes
# strict #RGB/#RRGGBB — no palette name, no {light=,dark=} pair — and
# auto_switch swaps the base Palette without ever reaching apply_token_style.
#
# Contrast depends on LUMINANCE ALONE, so hue and chroma are free. Every hex
# below sits at WCAG relative luminance Y = 0.173, the geometric-mean optimum
# between the two backgrounds, which yields 3.63:1 on BOTH — the ceiling for
# any single hex against this pair. Nothing here is brighter or dimmer than
# anything else, so nothing is harder to read than anything else.
#
# Hierarchy is carried by CHROMA, never by brightness — that is what keeps a
# recessive token legible instead of merely faint:
#   C 0.115  role tokens        the scan key, most saturated
#   C 0.105  $name              renamed title, emphasis
#   C 0.070  $session, $idle    context; $idle is the one warm hue, so a stale
#                               seat catches the eye against the cool field
#   C 0.030  $profile           bold carries it; colour stays quiet
#   C 0.014  $id, task title    near-neutral, reads as body text
#
# `dim` is off everywhere: DIM subtracts from an already-capped contrast, and
# a token that should recede uses low chroma instead.
#
# Adding a token: pick a hue, take a chroma off the ladder, and solve OKLCH
# lightness for Y = 0.173.
#
# Switching terminal theme family does NOT require re-deriving these. Y = 0.173
# sits near the geometric-mean optimum for any usual dark/light pair, and this
# set was measured at >= 3.16 on both halves of tokyo-night, catppuccin,
# gruvbox, solarized and rose-pine. Re-derive only for a background far outside
# that range — a near-black or a paper-white terminal.
claude = [
  [
    "state_icon",
    { token = "$role_worker", fg = "#31824d", bold = false, dim = false },
    { token = "$role_advisor", fg = "#8c63aa", bold = true, dim = false },
    { token = "$role_leader", fg = "#4275b6", bold = false, dim = false },
    { token = "$role", fg = "#6e7480", bold = false, dim = false },
    { token = "$name", fg = "#007f8c", bold = true, dim = false },
    { token = "$profile", fg = "#6b7386", bold = true, dim = false },
    { token = "$id", fg = "#70747c", dim = false },
  ],
  [
    { token = "$session", fg = "#63739e", dim = false },
    { token = "$idle", fg = "#aa6138", bold = false, dim = false },
  ],
  [
    { token = "terminal_title_stripped", fg = "#6e757e", dim = false },
  ],
]

# Grok has no ccc-statusd identity tokens ($role/$profile/…); style from
# built-ins only. Hues are deliberately not claude-blue: xAI magenta/pink so
# grok rows are scannable next to the fleet. Same luminance lock and chroma
# ladder as claude above.
grok = [
  [
    "state_icon",
    { token = "workspace", fg = "#9f5c99", bold = true, dim = false },
    { token = "tab", fg = "#6e7480", bold = false, dim = false },
    { token = "agent", fg = "#a05f81", bold = true, dim = false },
  ],
  [
    { token = "terminal_title_stripped", fg = "#866c81", dim = false },
  ],
]

# Expanded space rows. Built-ins are state_icon, state_text, workspace, branch, and git_status.
# Custom values reported through workspace metadata use a $name token, for example $jj_status.
# Inline token styles accept strict #RGB/#RRGGBB foregrounds plus bold and dim booleans.
[ui.sidebar.spaces]
# Blank rows between space entries. Set to 1 to restore the previous spacing.
row_gap = 0
rows = [["state_icon", "workspace"], ["branch", "git_status", "state_text"]]


# Background notification popup delivery
[ui.toast]
# off = disable pop-up notifications
# herdr = show in-app toasts
# terminal = ask the outer terminal to show a desktop notification
# system = ask the OS notification service directly
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
# position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

# Play sounds when agents change state in background workspaces
[ui.sound]
enabled = false
# Optional custom mp3 sound files. Relative paths are resolved from this config file's directory.
# path = "sounds/notification.mp3"   # one mp3 file for all sound notifications
# done_path = "sounds/done.mp3"      # overrides only finished notifications
# request_path = "sounds/request.mp3" # overrides only needs-attention notifications

# Per-agent overrides: default | on | off
# By default, droid is muted.
[ui.sound.agents]
droid = "off"

[session]
# Resume supported AI-agent panes into their native conversation sessions after
# a Herdr server restart. Requires official integrations that report session refs.
resume_agents_on_restore = true

[remote]
# Whether herdr manages the ssh config used for `herdr --remote`.
# When true (default), herdr runs remote ssh through a generated config that
# includes your ~/.ssh/config first and adds ServerAliveInterval/
# ServerAliveCountMax as fallbacks (so any keepalive values you set yourself
# still win) to survive idle network/NAT timeouts. Herdr also uses a private
# per-attach OpenSSH control socket to reuse the first authenticated connection.
# Set false to run plain ssh against your ssh config unchanged — this does not
# force keepalive or multiplexing off, it only stops herdr from adding its own.
# manage_ssh_config = true

[experimental]
# Allow launching herdr from inside a herdr-managed pane.
# allow_nested = false
# Experimental local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal.
kitty_graphics = true
# Save recent pane screen history across full server restarts.
pane_history = true
# While prefix mode is active, temporarily switch the macOS host input
# source to an ASCII-capable keyboard layout so prefix commands register
# even when a CJK IME is active, then restore the previous input source
# when prefix mode exits. macOS only; best-effort. Default: false.
# switch_ascii_input_source_in_prefix = false
# Expose the focused pane's cursor to the outer terminal so macOS input
# methods keep tracking the candidate window when TUIs paint their own
# cursor (Claude Code, pi, codex). Trade-off: extra cursor visible for
# apps that hide it without painting a replacement (vim normal mode, etc.).
# reveal_hidden_cursor_for_cjk_ime = false
# Optional allow-list: only reveal for focused panes whose detected agent
# matches one of these names. Empty means apply to any focused pane.
# If the list contains no valid names, the reveal does not apply.
# Accepted: pi, claude, codex, gemini, cursor, devin, cline, opencode,
# copilot, kimi, kiro, droid, amp, grok, hermes, kilo, qodercli, qoder.
# cjk_ime_agents = []
# Cursor shape rendered when reveal_hidden_cursor_for_cjk_ime is true.
# Values: block, steady_block (default), underline, steady_underline, bar, steady_bar.
# cjk_ime_cursor_shape = "steady_block"

[advanced]
# Maximum scrollback buffer size in bytes retained per pane terminal.
# Matches Ghostty's default scrollback-limit behavior.
# scrollback_limit_bytes = 10000000


# tmux's prefix+! (break-pane). Not bound to "!" itself: herdr treats "!" and
# "shift+1" as the same key, and custom commands win over indexed bindings, so
# "prefix+!" would shadow switch_workspace 1.
[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "herdr pane move \"$HERDR_ACTIVE_PANE_ID\" --new-tab --focus"
description = "break pane into new tab"

# Manual re-trigger of herdr's host-color harvest — the on-demand twin of the
# wezterm appearance hook's automatic poke (wezterm cannot emit mode-2031
# scheme reports, wezterm/wezterm#6454). Bare name, not an absolute path:
# herdr 0.8.0 runs custom commands with the full login PATH (measured for both
# shell and popup types), and the script ships to every host — osfiles/bin on
# the mac, the user profile on Linux boxes.
[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "herdr-poke-scheme"
description = "re-harvest host terminal colors"

# ccc-herdr-layout plugin: visual layout picker with live preview.
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "ccc-layout.pick"
description = "layout picker"

# ccc-herdr plugin: fuzzy jump to any agent or pane by id, name, title, role.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "ccc-herdr.jump"
description = "jump to agent"

# jhochenbaum.hunkdiff: review agent-authored diffs in hunk, send inline comments back.
# Hand-written, NOT installed via `setup-keys` — that action rewrites its whole managed
# block on every re-run, so edits inside it are lost.
#
# Both of upstream's first two defaults are unusable here:
#   prefix+shift+h → herdr 0.8.0 swap_pane_left (also shift+j/k/l = swap_pane_down/up/right).
#                    Undocumented in this file's comment block, which predates 0.8.0.
#   prefix+shift+c → herdr-poke-scheme, above.
# prefix+shift+v and prefix+shift+m replace them. Occupied prefix+shift+LETTER keys as of
# 0.8.0: b c d g h j k l n p r t w x — free: a e f i m o q s u v y z.
#
# Other actions (reload, close-review, next/prev-comment, review:branch, review:stash,
# install-pager) stay CLI-only: herdr plugin action invoke <id> --plugin jhochenbaum.hunkdiff
[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"
